    <g fill="#3ED0A2">
      <rect x="0" y="0" width="22" height="22" rx="4" fill-opacity="0.85"/><rect x="28" y="0" width="22" height="22" rx="4" fill-opacity="0.3"/><rect x="56" y="0" width="22" height="22" rx="4" fill-opacity="0.55"/><rect x="84" y="0" width="22" height="22" rx="4" fill-opacity="0.15"/><rect x="112" y="0" width="22" height="22" rx="4" fill-opacity="0.65"/><rect x="140" y="0" width="22" height="22" rx="4" fill-opacity="0.2"/><rect x="168" y="0" width="22" height="22" rx="4" fill-opacity="0.4"/><rect x="196" y="0" width="22" height="22" rx="4" fill-opacity="0.12"/>
      <rect x="0" y="28" width="22" height="22" rx="4" fill-opacity="0.25"/><rect x="28" y="28" width="22" height="22" rx="4" fill-opacity="0.7"/><rect x="56" y="28" width="22" height="22" rx="4" fill-opacity="0.18"/><rect x="84" y="28" width="22" height="22" rx="4" fill-opacity="0.5"/><rect x="112" y="28" width="22" height="22" rx="4" fill-opacity="0.22"/><rect x="140" y="28" width="22" height="22" rx="4" fill-opacity="0.45"/><rect x="168" y="28" width="22" height="22" rx="4" fill-opacity="0.14"/><rect x="196" y="28" width="22" height="22" rx="4" fill-opacity="0.35"/>
      <rect x="0" y="56" width="22" height="22" rx="4" fill-opacity="0.45"/><rect x="28" y="56" width="22" height="22" rx="4" fill-opacity="0.16"/><rect x="56" y="56" width="22" height="22" rx="4" fill-opacity="0.9"/><rect x="84" y="56" width="22" height="22" rx="4" fill-opacity="0.24"/><rect x="112" y="56" width="22" height="22" rx="4" fill-opacity="0.38"/><rect x="140" y="56" width="22" height="22" rx="4" fill-opacity="0.12"/><rect x="168" y="56" width="22" height="22" rx="4" fill-opacity="0.6"/><rect x="196" y="56" width="22" height="22" rx="4" fill-opacity="0.2"/>
      <rect x="0" y="84" width="22" height="22" rx="4" fill-opacity="0.14"/><rect x="28" y="84" width="22" height="22" rx="4" fill-opacity="0.4"/><rect x="56" y="84" width="22" height="22" rx="4" fill-opacity="0.2"/><rect x="84" y="84" width="22" height="22" rx="4" fill-opacity="0.75"/><rect x="112" y="84" width="22" height="22" rx="4" fill-opacity="0.16"/><rect x="140" y="84" width="22" height="22" rx="4" fill-opacity="0.3"/><rect x="168" y="84" width="22" height="22" rx="4" fill-opacity="0.5"/><rect x="196" y="84" width="22" height="22" rx="4" fill-opacity="0.18"/>
    </g>
  </g>
</svg>
