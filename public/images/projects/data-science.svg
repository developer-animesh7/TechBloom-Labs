      <path d="M20 198 C 56 210 84 178 118 190 C 152 202 178 172 208 184" stroke-opacity="0.6"/>
      <path d="M20 320 C 56 300 84 322 118 306 C 152 290 178 312 208 296" stroke-opacity="0.4"/>
    </g>
  </g>

