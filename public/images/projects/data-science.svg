<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Analytics dashboard composition with forecast curve, distribution bars and cohort matrix">
  <defs>
    <linearGradient id="di-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A26"/>
      <stop offset="1" stop-color="#0A1016"/>
    </linearGradient>
    <linearGradient id="di-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ED0A2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ED0A2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" fill="url(#di-bg)"/>
  <g stroke="#EEF3F0" stroke-opacity="0.07">
    <path d="M0 80h1000M0 160h1000M0 240h1000M0 320h1000M0 400h1000M0 480h1000M0 560h1000"/>
  </g>

  <!-- forecast chart -->
  <g transform="translate(72,88)">
    <text x="0" y="-18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.4" fill="#3ED0A2">FORECAST</text>
    <path d="M0 236 L 0 168 C 60 150 96 196 152 160 C 208 124 244 156 300 108 C 356 60 402 82 460 40 L 460 236 Z" fill="url(#di-fill)"/>
    <path d="M0 168 C 60 150 96 196 152 160 C 208 124 244 156 300 108 C 356 60 402 82 460 40"
          fill="none" stroke="#3ED0A2" stroke-width="3" stroke-linecap="round"/>
    <path d="M460 40 C 500 26 528 44 560 20" fill="none" stroke="#3ED0A2" stroke-width="3" stroke-dasharray="7 7" stroke-opacity="0.7" stroke-linecap="round"/>
    <g fill="#EEF3F0">
      <circle cx="152" cy="160" r="4.5" fill-opacity="0.8"/><circle cx="300" cy="108" r="4.5" fill-opacity="0.8"/><circle cx="460" cy="40" r="6"/>
    </g>
    <path d="M0 236h564" stroke="#EEF3F0" stroke-opacity="0.22"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8" fill="#EEF3F0" fill-opacity="0.35">
      <text x="0" y="258">Q1</text><text x="140" y="258">Q2</text><text x="288" y="258">Q3</text><text x="428" y="258">Q4</text><text x="536" y="258">EST</text>
    </g>
  </g>

  <!-- distribution bars -->
  <g transform="translate(72,404)">
    <text x="0" y="-16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.4" fill="#EEF3F0" fill-opacity="0.45">DISTRIBUTION</text>
    <g fill="#EEF3F0" fill-opacity="0.22">
      <rect x="0" y="64" width="34" height="76" rx="3"/>
      <rect x="46" y="40" width="34" height="100" rx="3"/>
      <rect x="92" y="14" width="34" height="126" rx="3" fill="#3ED0A2" fill-opacity="0.85"/>
      <rect x="138" y="52" width="34" height="88" rx="3"/>
      <rect x="184" y="88" width="34" height="52" rx="3"/>
      <rect x="230" y="106" width="34" height="34" rx="3"/>
      <rect x="276" y="72" width="34" height="68" rx="3"/>
      <rect x="322" y="96" width="34" height="44" rx="3"/>
    </g>
    <path d="M0 140h360" stroke="#EEF3F0" stroke-opacity="0.22"/>
  </g>

  <!-- KPI stack -->
  <g transform="translate(700,96)">
    <g fill="#EEF3F0" fill-opacity="0.06" stroke="#EEF3F0" stroke-opacity="0.16">
      <rect width="228" height="104" rx="10"/>
      <rect y="122" width="228" height="104" rx="10"/>
      <rect y="244" width="228" height="104" rx="10"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2" fill="#3ED0A2">
