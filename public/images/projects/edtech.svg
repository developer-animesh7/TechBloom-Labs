  <!-- Left: Modular Syllabus & Lesson Structure -->
  <g transform="translate(68, 126)">
    <!-- Container -->
    <rect width="490" height="454" rx="14" fill="url(#ed-card-bg)" stroke="#1F362D" stroke-opacity="0.15" stroke-width="1.5"/>

    <text x="28" y="38" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#0C7A5E" font-weight="700">COURSE SYLLABUS · ADVANCED TRACK</text>
    <text x="28" y="56" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1F362D" fill-opacity="0.55">Interactive Modules &amp; Assessment Gates</text>

    <!-- Module Unit 01: Completed -->
    <g transform="translate(24, 76)">
      <rect width="442" height="74" rx="10" fill="#FFFFFF" stroke="#0C7A5E" stroke-opacity="0.3" stroke-width="1.2"/>
      <!-- Left indicator badge -->
      <rect x="0" y="0" width="6" height="74" rx="3" fill="#0C7A5E"/>
      
      <circle cx="34" cy="37" r="14" fill="#E8F6F1"/>
      <path d="M29 37 L 33 41 L 39 33" stroke="#0C7A5E" stroke-width="2.2" fill="none" stroke-linecap="round"/>

      <text x="60" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#142620">Unit 01: Computational Systems &amp; Logic</text>
      <text x="60" y="48" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1F362D" fill-opacity="0.6">4 Lessons · 2 Interactive Labs · Verified</text>
      
