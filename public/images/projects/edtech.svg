      <text x="24" y="34" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#3ED0A2" font-weight="700">COHORT PROGRESSION</text>
      
      <!-- Mini cohort bar chart -->
      <g transform="translate(24, 52)">
        <g fill="#3ED0A2" fill-opacity="0.85">
          <rect x="0" y="58" width="24" height="42" rx="3"/>
          <rect x="34" y="36" width="24" height="64" rx="3"/>
          <rect x="68" y="20" width="24" height="80" rx="3"/>
          <rect x="102" y="12" width="24" height="88" rx="3"/>
          <rect x="136" y="28" width="24" height="72" rx="3"/>
          <rect x="170" y="44" width="24" height="56" rx="3"/>
          <rect x="204" y="30" width="24" height="70" rx="3"/>
          <rect x="238" y="16" width="24" height="84" rx="3"/>
          <rect x="272" y="8" width="24" height="92" rx="3"/>
        </g>
        <line x1="0" y1="104" x2="306" y2="104" stroke="#EEF3F0" stroke-opacity="0.2"/>
      </g>

      <g font-family="ui-monospace, monospace" font-size="10" fill="#EEF3F0" fill-opacity="0.6">
        <text x="24" y="180">COHORT 08 · 96.4% MILESTONE ON-TRACK</text>
      </g>
    </g>
