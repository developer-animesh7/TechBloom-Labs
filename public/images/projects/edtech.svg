        <text x="306" y="12" font-family="ui-monospace, monospace" font-size="11" fill="#0C7A5E" text-anchor="end" font-weight="700">94%</text>
        <rect y="20" width="306" height="7" rx="3.5" fill="#E8E6DF"/>
        <rect y="20" width="288" height="7" rx="3.5" fill="#0C7A5E"/>
      </g>

      <!-- Competency Bar 2 -->
      <g transform="translate(24, 124)">
        <text x="0" y="12" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#142620">System Architecture &amp; Design</text>
        <text x="306" y="12" font-family="ui-monospace, monospace" font-size="11" fill="#0C7A5E" text-anchor="end" font-weight="700">88%</text>
        <rect y="20" width="306" height="7" rx="3.5" fill="#E8E6DF"/>
        <rect y="20" width="269" height="7" rx="3.5" fill="#0C7A5E"/>
      </g>

      <!-- Competency Bar 3 -->
      <g transform="translate(24, 172)">
        <text x="0" y="12" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#142620">Practical Lab &amp; Execution</text>
        <text x="306" y="12" font-family="ui-monospace, monospace" font-size="11" fill="#0C7A5E" text-anchor="end" font-weight="700">92%</text>
        <rect y="20" width="306" height="7" rx="3.5" fill="#E8E6DF"/>
        <rect y="20" width="281" height="7" rx="3.5" fill="#0C7A5E"/>
      </g>
    </g>

