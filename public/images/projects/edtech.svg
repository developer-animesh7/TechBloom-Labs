      <text x="383" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#0C7A5E" text-anchor="middle" font-weight="700">100% COMPLETE</text>
    </g>

    <!-- Module Unit 02: In Progress (Active) -->
    <g transform="translate(24, 162)">
      <rect width="442" height="96" rx="10" fill="#FFFFFF" stroke="#0C7A5E" stroke-width="2"/>
      <!-- Left indicator badge -->
      <rect x="0" y="0" width="6" height="96" rx="3" fill="#0C7A5E"/>
      
      <circle cx="34" cy="36" r="14" fill="#0C7A5E"/>
      <text x="34" y="40" font-family="ui-monospace, monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">02</text>

      <text x="60" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#142620">Unit 02: Modular Distributed Engineering</text>
      <text x="60" y="48" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0C7A5E" font-weight="600">Active Module · Lesson 3 of 5 In Progress</text>

      <!-- Progress Track -->
      <g transform="translate(60, 64)">
        <rect width="280" height="8" rx="4" fill="#E5E4DE"/>
        <rect width="196" height="8" rx="4" fill="#0C7A5E"/>
        <text x="294" y="8" font-family="ui-monospace, monospace" font-size="10" fill="#0C7A5E" font-weight="700">70%</text>
      </g>
    </g>

    <!-- Module Unit 03: Queued / Next -->
    <g transform="translate(24, 270)">
      <rect width="442" height="74" rx="10" fill="#FFFFFF" stroke="#1F362D" stroke-opacity="0.12" stroke-width="1"/>
      <circle cx="34" cy="37" r="14" fill="#F0EFE9"/>
      <text x="34" y="41" font-family="ui-monospace, monospace" font-size="11" fill="#1F362D" fill-opacity="0.6" text-anchor="middle">03</text>

      <text x="60" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#142620">Unit 03: Systems Verification &amp; Testing</text>
