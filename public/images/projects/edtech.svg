      <rect x="354" y="25" width="72" height="24" rx="12" fill="#F0EFE9"/>
      <text x="390" y="41" font-family="ui-monospace, monospace" font-size="10" fill="#1F362D" fill-opacity="0.7" text-anchor="middle">UNLOCKED</text>
    </g>

    <!-- Module Unit 04: Final Capstone -->
    <g transform="translate(24, 356)">
      <rect width="442" height="74" rx="10" fill="#FFFFFF" fill-opacity="0.6" stroke="#1F362D" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="34" cy="37" r="14" fill="#F4F3EE"/>
      <text x="34" y="41" font-family="ui-monospace, monospace" font-size="11" fill="#1F362D" fill-opacity="0.35" text-anchor="middle">04</text>

      <text x="60" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#142620" fill-opacity="0.6">Unit 04: Real-World Industry Capstone</text>
      <text x="60" y="48" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1F362D" fill-opacity="0.4">Peer Review &amp; Advisor Defense Evaluation</text>
      
      <rect x="364" y="25" width="62" height="24" rx="12" fill="#F4F3EE"/>
      <text x="395" y="41" font-family="ui-monospace, monospace" font-size="10" fill="#1F362D" fill-opacity="0.4" text-anchor="middle">LOCKED</text>
    </g>
  </g>

  <!-- Right: Learning Analytics & Mastery Outcome -->
  <g transform="translate(578, 126)">
