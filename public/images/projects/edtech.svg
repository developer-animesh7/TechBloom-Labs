<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Interactive learning management curriculum architecture with course module units and student cohort mastery tracking">
  <defs>
    <linearGradient id="ed-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F3EE"/>
      <stop offset="1" stop-color="#E5E3D8"/>
    </linearGradient>
    <linearGradient id="ed-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F8F7F3" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="640" fill="url(#ed-bg)"/>

  <!-- Subtle Blueprint / Grid Lines -->
  <g stroke="#1F362D" stroke-opacity="0.06">
    <path d="M0 64h1000M0 128h1000M0 192h1000M0 256h1000M0 320h1000M0 384h1000M0 448h1000M0 512h1000M0 576h1000"/>
    <path d="M80 0v640M160 0v640M240 0v640M320 0v640M400 0v640M480 0v640M560 0v640M640 0v640M720 0v640M800 0v640M880 0v640"/>
  </g>

  <!-- Top Curriculum Navigation Track -->
  <g transform="translate(68, 60)">
    <rect width="864" height="48" rx="10" fill="#FFFFFF" fill-opacity="0.8" stroke="#1F362D" stroke-opacity="0.14"/>
    <text x="24" y="28" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2.2" fill="#0C7A5E" font-weight="700">LEARNGRID · CURRICULUM ARCHITECTURE</text>
    
    <!-- Stage indicators -->
    <g transform="translate(420, 14)">
      <!-- Stage 1 -->
      <circle cx="10" cy="10" r="10" fill="#0C7A5E"/>
      <path d="M7 10 L 9 12 L 13 8" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="26" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1F362D">Core Modules</text>

      <!-- Connecting line -->
      <line x1="104" y1="10" x2="134" y2="10" stroke="#0C7A5E" stroke-width="2"/>

      <!-- Stage 2 -->
      <circle cx="144" cy="10" r="10" fill="#0C7A5E" fill-opacity="0.8"/>
      <circle cx="144" cy="10" r="4" fill="#FFFFFF"/>
      <text x="160" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1F362D" font-weight="600">Specialization</text>

      <!-- Connecting line -->
      <line x1="244" y1="10" x2="274" y2="10" stroke="#1F362D" stroke-opacity="0.25" stroke-dasharray="3 3"/>

      <!-- Stage 3 -->
      <circle cx="284" cy="10" r="10" fill="#1F362D" fill-opacity="0.15"/>
      <circle cx="284" cy="10" r="4" fill="#1F362D" fill-opacity="0.4"/>
      <text x="300" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1F362D" fill-opacity="0.6">Capstone Evaluation</text>
