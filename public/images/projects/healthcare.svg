<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Healthcare service coordination diagram with appointment queue, workflow stages and monitoring trace">
  <defs>
    <linearGradient id="hf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EFF1"/>
      <stop offset="1" stop-color="#D6E4E6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="url(#hf-bg)"/>
  <g stroke="#123B44" stroke-opacity="0.08">
    <path d="M0 64h1000M0 128h1000M0 192h1000M0 256h1000M0 320h1000M0 384h1000M0 448h1000M0 512h1000M0 576h1000"/>
  </g>

  <!-- workflow rail -->
  <path d="M96 200h808" stroke="#123B44" stroke-opacity="0.25" stroke-width="2"/>
  <g>
    <g fill="#0C7A5E">
      <circle cx="96" cy="200" r="12"/><circle cx="298" cy="200" r="12" fill-opacity="0.82"/><circle cx="500" cy="200" r="12" fill-opacity="0.64"/><circle cx="702" cy="200" r="12" fill-opacity="0.46"/><circle cx="904" cy="200" r="12" fill-opacity="0.3"/>
    </g>
    <g font-family="Inter, system-ui, sans-serif" font-size="15" fill="#123B44" fill-opacity="0.75" text-anchor="middle">
      <text x="96" y="166">Intake</text>
      <text x="298" y="166">Triage</text>
      <text x="500" y="166">Appointment</text>
      <text x="702" y="166">Care team</text>
      <text x="904" y="166">Follow-up</text>
    </g>
  </g>

  <!-- queue board -->
  <g transform="translate(80,264)">
    <rect width="404" height="264" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#123B44" stroke-opacity="0.2"/>
    <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.2" fill="#0C7A5E">COORDINATION BOARD</text>
    <g>
      <rect x="24" y="60" width="356" height="44" rx="8" fill="#123B44" fill-opacity="0.06"/>
      <rect x="24" y="114" width="356" height="44" rx="8" fill="#123B44" fill-opacity="0.06"/>
      <rect x="24" y="168" width="356" height="44" rx="8" fill="#123B44" fill-opacity="0.06"/>
    </g>
    <g fill="#123B44" fill-opacity="0.45">
      <rect x="40" y="76" width="120" height="8" rx="4"/>
      <rect x="40" y="90" width="72" height="6" rx="3" fill-opacity="0.3"/>
      <rect x="40" y="130" width="150" height="8" rx="4"/>
      <rect x="40" y="144" width="88" height="6" rx="3" fill-opacity="0.3"/>
      <rect x="40" y="184" width="104" height="8" rx="4"/>
      <rect x="40" y="198" width="64" height="6" rx="3" fill-opacity="0.3"/>
    </g>
    <g>
      <rect x="286" y="72" width="78" height="20" rx="10" fill="#0C7A5E" fill-opacity="0.85"/>
      <rect x="286" y="126" width="78" height="20" rx="10" fill="#123B44" fill-opacity="0.25"/>
      <rect x="286" y="180" width="78" height="20" rx="10" fill="#123B44" fill-opacity="0.18"/>
    </g>
    <text x="24" y="244" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#123B44" fill-opacity="0.55">Scheduling · resources · records</text>
  </g>

  <!-- monitoring trace -->
  <g transform="translate(524,264)">
    <rect width="396" height="264" rx="12" fill="#0B1512" fill-opacity="0.92"/>
    <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.2" fill="#3ED0A2">OPERATIONAL SIGNAL</text>
    <g stroke="#EEF3F0" stroke-opacity="0.16">
      <path d="M24 96h348"/><path d="M24 152h348"/><path d="M24 208h348"/>
    </g>
    <path d="M24 176 L 62 176 L 78 118 L 96 208 L 118 156 L 156 156 L 174 96 L 192 200 L 214 152 L 268 152 L 286 110 L 304 194 L 324 152 L 372 152"
          fill="none" stroke="#3ED0A2" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#EEF3F0" fill-opacity="0.5" font-family="Inter, system-ui, sans-serif" font-size="14">
      <text x="24" y="240">Workflow throughput over time</text>
    </g>
  </g>
</svg>
