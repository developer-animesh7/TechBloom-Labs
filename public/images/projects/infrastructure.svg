<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Construction site schematic with tower crane, structural frame and project milestone bars">
  <defs>
    <linearGradient id="is-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EAEE"/>
      <stop offset="1" stop-color="#D3DAE1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="url(#is-bg)"/>

  <!-- blueprint grid -->
  <g stroke="#22384C" stroke-opacity="0.1">
    <path d="M0 80h1000M0 160h1000M0 240h1000M0 320h1000M0 400h1000M0 480h1000M0 560h1000"/>
    <path d="M80 0v640M160 0v640M240 0v640M320 0v640M400 0v640M480 0v640M560 0v640M640 0v640M720 0v640M800 0v640M880 0v640"/>
  </g>

  <!-- structural frame -->
  <g stroke="#22384C" stroke-opacity="0.72" stroke-width="3" fill="none">
    <path d="M120 560V236h300v324"/>
    <path d="M120 320h300M120 400h300M120 480h300"/>
    <path d="M120 236 L 420 320 M 420 236 L 120 320"/>
    <path d="M120 400 L 420 480 M 420 400 L 120 480"/>
  </g>
  <g fill="#22384C" fill-opacity="0.14">
    <rect x="124" y="324" width="292" height="72"/>
    <rect x="124" y="484" width="292" height="72"/>
  </g>

  <!-- crane -->
  <g stroke="#0C7A5E" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M620 560V120"/>
    <path d="M470 120h330"/>
    <path d="M620 120 L 540 168 M 620 120 L 700 168"/>
  </g>
  <g stroke="#0C7A5E" stroke-width="2" stroke-opacity="0.7">
    <path d="M520 120v96"/>
    <path d="M620 150 L 470 120 M 620 150 L 800 120"/>
  </g>
  <rect x="502" y="216" width="36" height="30" rx="4" fill="#0C7A5E"/>
  <rect x="592" y="560" width="56" height="14" rx="3" fill="#22384C" fill-opacity="0.8"/>

  <!-- ground -->
  <path d="M0 574h1000" stroke="#22384C" stroke-opacity="0.55" stroke-width="2"/>
  <g stroke="#22384C" stroke-opacity="0.3">
    <path d="M0 596h1000" stroke-dasharray="12 10"/>
  </g>

  <!-- material stacks -->
  <g fill="#22384C" fill-opacity="0.5">
    <rect x="760" y="524" width="120" height="12" rx="2"/>
    <rect x="760" y="540" width="120" height="12" rx="2"/>
    <rect x="772" y="556" width="96" height="12" rx="2"/>
  </g>

  <!-- milestone / gantt card -->
  <g transform="translate(624,262)">
    <rect width="316" height="188" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#22384C" stroke-opacity="0.24"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.2" fill="#0C7A5E">MILESTONES</text>
    <g>
      <rect x="22" y="56" width="180" height="12" rx="6" fill="#0C7A5E" fill-opacity="0.9"/>
      <rect x="22" y="84" width="240" height="12" rx="6" fill="#22384C" fill-opacity="0.35"/>
      <rect x="60" y="112" width="150" height="12" rx="6" fill="#22384C" fill-opacity="0.25"/>
      <rect x="98" y="140" width="120" height="12" rx="6" fill="#22384C" fill-opacity="0.18"/>
    </g>
    <path d="M212 48v120" stroke="#0C7A5E" stroke-opacity="0.6" stroke-dasharray="4 5"/>
  </g>
</svg>
