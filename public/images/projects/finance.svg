<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Financial technology ledger dashboard with transaction reconciliation table and settlement liquidity telemetry">
  <defs>
    <linearGradient id="fin-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1724"/>
      <stop offset="1" stop-color="#070D16"/>
    </linearGradient>
    <linearGradient id="fin-curve-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ED0A2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ED0A2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="640" fill="url(#fin-bg)"/>

  <!-- Technical Ledger Grid -->
  <g stroke="#EEF3F0" stroke-opacity="0.05">
    <path d="M0 64h1000M0 128h1000M0 192h1000M0 256h1000M0 320h1000M0 384h1000M0 448h1000M0 512h1000M0 576h1000"/>
    <path d="M80 0v640M160 0v640M240 0v640M320 0v640M400 0v640M480 0v640M560 0v640M640 0v640M720 0v640M800 0v640M880 0v640"/>
  </g>

  <!-- Left: Double-Entry Immutable Ledger Journal -->
  <g transform="translate(68, 76)">
