  <!-- automation rule card -->
  <g transform="translate(768,120)">
    <rect width="176" height="392" rx="10" fill="#0B1512" fill-opacity="0.92"/>
    <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.2" fill="#3ED0A2">AUTOMATION</text>
