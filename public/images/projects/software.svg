    <g fill="#3ED0A2">
      <circle cx="32" cy="110" r="5"/><circle cx="80" cy="190" r="5" fill-opacity="0.7"/><circle cx="80" cy="270" r="5" fill-opacity="0.5"/>
    </g>
    <g fill="#EEF3F0" fill-opacity="0.35">
