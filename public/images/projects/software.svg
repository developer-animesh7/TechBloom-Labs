<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Enterprise workflow diagram with task columns, approval branches and automation rules">
  <defs>
    <linearGradient id="sw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDEDE8"/>
      <stop offset="1" stop-color="#DEE0DA"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" fill="url(#sw-bg)"/>
  <g stroke="#0B1512" stroke-opacity="0.07">
    <path d="M0 60h1000M0 120h1000M0 180h1000M0 240h1000M0 300h1000M0 360h1000M0 420h1000M0 480h1000M0 540h1000M0 600h1000"/>
  </g>

  <!-- kanban columns -->
  <g transform="translate(72,96)">
