      <rect x="34" y="154" width="112" height="7" rx="3.5"/><rect x="34" y="170" width="48" height="6" rx="3" fill-opacity="0.25"/>
      <rect x="34" y="238" width="76" height="7" rx="3.5"/><rect x="34" y="254" width="88" height="6" rx="3" fill-opacity="0.25"/>
      <rect x="262" y="70" width="104" height="7" rx="3.5"/><rect x="262" y="86" width="56" height="6" rx="3" fill-opacity="0.25"/>
      <rect x="262" y="154" width="84" height="7" rx="3.5"/><rect x="262" y="170" width="72" height="6" rx="3" fill-opacity="0.25"/>
      <rect x="490" y="70" width="96" height="7" rx="3.5"/><rect x="490" y="86" width="64" height="6" rx="3" fill-opacity="0.25"/>
    </g>
    <g>
      <rect x="34" y="102" width="40" height="12" rx="6" fill="#0C7A5E" fill-opacity="0.8"/>
      <rect x="34" y="186" width="52" height="12" rx="6" fill="#0B1512" fill-opacity="0.2"/>
      <rect x="34" y="270" width="34" height="12" rx="6" fill="#0B1512" fill-opacity="0.16"/>
      <rect x="262" y="102" width="46" height="12" rx="6" fill="#0C7A5E" fill-opacity="0.55"/>
      <rect x="262" y="186" width="38" height="12" rx="6" fill="#0B1512" fill-opacity="0.18"/>
      <rect x="490" y="102" width="58" height="12" rx="6" fill="#0C7A5E" fill-opacity="0.9"/>
