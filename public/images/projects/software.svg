      <rect x="456" width="200" height="440" rx="10"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.2" fill="#0B1512" fill-opacity="0.55">
      <text x="20" y="34">QUEUE</text>
      <text x="248" y="34">IN PROGRESS</text>
      <text x="476" y="34">REVIEW</text>
