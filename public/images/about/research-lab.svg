      <rect x="106" y="252" width="52" height="16" rx="8" fill-opacity="0.35"/>
    </g>
  </g>

  <!-- sample bottles -->
  <g transform="translate(126,404)">
    <g stroke="#0B1512" stroke-opacity="0.5" stroke-width="2.2" fill="#FFFFFF" fill-opacity="0.55">
      <rect x="0" y="30" width="40" height="126" rx="12"/>
      <rect x="56" y="52" width="40" height="104" rx="12"/>
    </g>
    <g fill="#0B1512" fill-opacity="0.6">
      <rect x="6" y="18" width="28" height="14" rx="5"/>
      <rect x="62" y="40" width="28" height="14" rx="5"/>
    </g>
    <g fill="#0C7A5E">
      <rect x="2" y="96" width="36" height="58" rx="10" fill-opacity="0.75"/>
      <rect x="58" y="110" width="36" height="44" rx="10" fill-opacity="0.5"/>
    </g>
  </g>
</svg>
