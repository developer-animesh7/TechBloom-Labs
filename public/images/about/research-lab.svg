<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Research workstation with microscope, specimen slides and observation notes">
  <defs>
    <linearGradient id="rl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9EDE9"/>
      <stop offset="1" stop-color="#D7E0DA"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#rl-bg)"/>
  <g stroke="#0B1512" stroke-opacity="0.07">
    <path d="M0 100h1000M0 200h1000M0 300h1000M0 400h1000M0 500h1000M0 600h1000"/>
    <path d="M100 0v700M200 0v700M300 0v700M400 0v700M500 0v700M600 0v700M700 0v700M800 0v700M900 0v700"/>
  </g>

  <!-- bench -->
  <path d="M0 560h1000" stroke="#0B1512" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="0" y="560" width="1000" height="140" fill="#0B1512" fill-opacity="0.07"/>

  <!-- microscope -->
  <g stroke="#0B1512" stroke-opacity="0.72" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300 560h180"/>
    <path d="M390 560V438"/>
    <path d="M390 438h-52"/>
    <path d="M338 438V300a52 52 0 0 1 52-52h34"/>
    <path d="M338 470h104"/>
  </g>
  <g fill="#0B1512" fill-opacity="0.72">
    <rect x="322" y="228" width="34" height="76" rx="10"/>
    <rect x="288" y="546" width="204" height="16" rx="6"/>
  </g>
  <rect x="328" y="196" width="22" height="40" rx="8" fill="#0C7A5E"/>
  <rect x="316" y="462" width="140" height="10" rx="4" fill="#0C7A5E" fill-opacity="0.55"/>

  <!-- specimen slides -->
  <g transform="translate(556,462)">
    <g fill="#FFFFFF" fill-opacity="0.85" stroke="#0B1512" stroke-opacity="0.35">
      <rect x="0" y="0" width="106" height="26" rx="4"/>
      <rect x="0" y="34" width="106" height="26" rx="4"/>
      <rect x="0" y="68" width="106" height="26" rx="4"/>
    </g>
    <g fill="#0C7A5E">
      <circle cx="30" cy="13" r="7" fill-opacity="0.85"/>
      <circle cx="30" cy="47" r="7" fill-opacity="0.5"/>
      <circle cx="30" cy="81" r="7" fill-opacity="0.7"/>
    </g>
    <text x="0" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.2" fill="#0B1512" fill-opacity="0.55">SPECIMENS</text>
  </g>

  <!-- observation card -->
  <g transform="translate(556,120)">
    <rect width="344" height="292" rx="10" fill="#FFFFFF" fill-opacity="0.9" stroke="#0B1512" stroke-opacity="0.2"/>
    <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.4" fill="#0C7A5E">OBSERVATION LOG</text>
    <g stroke="#0B1512" stroke-opacity="0.16">
      <path d="M24 60h296"/><path d="M24 104h296"/><path d="M24 148h296"/><path d="M24 192h296"/><path d="M24 236h296"/>
    </g>
    <g fill="#0B1512" fill-opacity="0.42">
      <rect x="24" y="74" width="120" height="8" rx="4"/>
      <rect x="180" y="74" width="64" height="8" rx="4" fill-opacity="0.24"/>
      <rect x="24" y="118" width="86" height="8" rx="4"/>
      <rect x="180" y="118" width="98" height="8" rx="4" fill-opacity="0.24"/>
      <rect x="24" y="162" width="140" height="8" rx="4"/>
      <rect x="180" y="162" width="52" height="8" rx="4" fill-opacity="0.24"/>
      <rect x="24" y="206" width="72" height="8" rx="4"/>
      <rect x="180" y="206" width="110" height="8" rx="4" fill-opacity="0.24"/>
    </g>
    <g fill="#0C7A5E">
